b cycle window-minimized

# انتقال افزایش ساب‌دیلای از x به h
h add sub-delay 0.1

# انتقال کاهش ساب‌دیلای از z به g
g add sub-delay -0.1

# اتصال کلید z به اسکریپت سرعت
z script-binding toggle-speed



# تغییر سرعت عادی
c multiply speed 1.1
x multiply speed 1/1.1

# تغییر سرعت دوبرابری
Shift+c multiply speed 2
Shift+x multiply speed 0.5

# تغییر زبان صدا و زیرنویس
Ctrl+d cycle audio
Ctrl+s cycle sub

# ذخیره عکس
Ctrl+m screenshot

# ساب‌دیلای (از قبل داشتیم)
h add sub-delay 0.1
g add sub-delay -0.1

# اسکریپت سرعت (Z)
z script-binding toggle-speed
