profile=sub-box
sub-font="Vazirmatn"
sub-font-size=45
sub-color="#FFFFFF"
sub-pos=95
sub-ass-override=force
sub-back-color=0/0/0/0.50


# --- تنظیمات صوتی برای هندزفری ---

# ۱. انتخاب درایور صوتی مناسب ویندوز
ao=wasapi

# ۲. فعال‌سازی بیس و شفافیت (مثل X-Bass گوشی)
af=equalizer=f=32:width_type=h:width=10:g=5,equalizer=f=64:width_type=h:width=10:g=3

# ۳. شبیه‌سازی فضای سه‌بعدی برای هندزفری (اختیاری)
af-add=bs2b:fcut=700:feed=50

volume=20
